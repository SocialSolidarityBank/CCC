# gitleaks 설정 — 기본 룰 + CCC 전용 룰 + 오탐 허용목록.
#
# 2026-07-28 정정: 이 파일에는 오래도록 [[allowlists]] 만 있고 룰이 하나도 없었다.
# 룰이 0개인 gitleaks 는 무엇을 스캔하든 "no leaks found" 를 돌려준다 — 이 레포의
# 시크릿 검사는 통과해 온 것이 아니라 수행된 적이 없었다. 레포 전환(구 레포는 비공개
# 아카이브 CCC-archive) 때 이 설정이 그대로 넘어왔고, 전환 근거로 적힌 "gitleaks
# no leaks" 도 같은 이유로 아무것도 증명하지 못한다. 기본 룰을 켜고, 실제로 이 레포에
# 남아 있던 모양(Access 서비스 토큰 Client ID)에 룰을 붙인다.
#
# 실행 지점은 pre-commit 훅이다(`pnpm guard:secrets`). CI 에도 단계를 두었지만
# Actions 사용량이 소진돼 안 도는 기간이 있으므로 훅이 본진이다.

[extend]
useDefault = true

# --- CCC 전용 룰 ---------------------------------------------------------

# Cloudflare Access 서비스 토큰의 Client ID(32 hex + '.access').
# 자격증명의 공개 절반이라 이것만으로 인증되지는 않지만, 어느 non-identity 정책을
# 노려야 하는지를 정확히 알려주므로 커밋 대상이 아니다. Secret 절반은 Infisical 에만 둔다.
[[rules]]
id = "cloudflare-access-service-token-client-id"
description = "Cloudflare Access service token Client ID (32 hex + .access)"
regex = '''[0-9a-f]{32}\.access'''
keywords = [".access"]

# --- 오탐 허용목록 -------------------------------------------------------
#
# **값 기준으로만 면제한다 — paths 를 쓰지 않는다.**
# gitleaks 는 `dir`/`file` 모드에서 전역 allowlist 의 paths 를 **파일 통째 제외**로
# 취급한다(condition 과 regexes 를 무시한다). 그래서 paths 를 쓰면 "이 값 2개를
# 봐준다" 가 아니라 "이 파일을 아예 안 본다" 가 된다 — 하필 apps/api/wrangler.toml 은
# 자격증명이 실수로 들어가기 가장 쉬운 파일이다.
# 지금 돌아가는 두 경로(pre-commit·CI)는 전부 git 모드라 당장 영향은 없었지만,
# 룰이 0개일 때 무해하던 설정이 스캐너를 켜는 순간 함정이 된다.
# 회귀 고정: scripts/guard-secrets-allowlist.test.mjs
#
# 1) ACCESS_AUD (apps/api/wrangler.toml)
#    Cloudflare Access 의 audience 태그. JWT 검증용 공개 식별자이며 자격증명이 아니다.
# 2) TEST_PII_KEY (apps/api/test/support/d1.ts)
#    base64("12345678901234567890123456789012") — 테스트용 더미 키.
#
# 히스토리에 남은 알려진 발견은 `.gitleaksignore` 에 지문으로 둔다 — 오탐이 아니라
# 실제 발견이고 성격이 다르므로 자리를 갈랐다.

[[allowlists]]
description = "CCC false positives: Access audience tag, test dummy PII key (값 기준 — paths 금지)"
regexes = [
  '''3dbacf213494f7624c00676ce62742c414528997fd2a23c21e926c16d79404d2''',
  '''MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=''',
]
