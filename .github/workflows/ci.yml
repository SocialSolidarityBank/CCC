name: CI

# `push` 를 main 으로 좁힌 이유 (2026-08-01): 브랜치 제한이 없으면 PR 브랜치가 **한 번
# 밀 때마다 두 번** 돈다 — 같은 커밋에 push 와 pull_request 가 각각 붙는다. 최근 40회 중
# 6개 브랜치가 그렇게 두 줄씩 남겼다. 검증 범위는 줄지 않는다: 머지 전은 pull_request 가,
# 머지 후는 main push 가 그대로 덮는다. 줄어드는 것은 같은 커밋을 두 번 검사하는 몫뿐이다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 오면 이전 실행을 취소한다 (2026-08-02). 위 주석이 없앤 것이
# "같은 커밋을 두 번" 이라면, 이것이 없애는 것은 "**낡은 커밋을** 끝까지 검사하는" 몫이다.
# 리베이스·스쿼시로 head 가 바뀌면 직전 실행의 결과는 어차피 쓰지 않는다.
# main 은 취소하지 않는다 — 연달아 머지될 때 앞 커밋이 미검증으로 남으면 안 되고,
# 이 파일의 secret-scan·pipeline-test 는 deploy-preview.yml 의 verify 에 없다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:db
      - run: pnpm guard:doc-numbers
      - run: pnpm guard:consent-copy
      - run: pnpm guard:tokens
      - run: pnpm guard:align
      # 위계 감사(CCC-80). guard:tokens 가 값 한 축씩을 보는 자리에서, 이쪽은 한 요소에 최종적으로
      # 적히는 조합을 본다. 검사 자신이 헛돌지 않는지는 :test 가 지킨다 — 위반 0 과
      # "아무것도 못 봄"이 화면에서 같아 보이기 때문에 검사보다 이 테스트가 먼저 있어야 한다.
      - run: pnpm guard:hierarchy:test
      - run: pnpm guard:hierarchy
      # 배포 판정(CCC-89). 이 판정이 2026-08-10 에 거짓 성공을 냈다 — 안 나간 배포를 나갔다고
      # 보고했고, API 를 따로 확인하지 않았으면 그대로 넘어갔다. 그 입력 모양을 고정한다.
      - run: pnpm guard:deploy-verdict
      - run: pnpm guard:deploy-gates

  # 전 라우트 인벤토리 동기화(디자인 통일 시드 AC5). page.tsx 집합과
  # scripts/design/route-inventory.json 이 어긋나면 머지를 막는다. 라우트가 늘었는데
  # 실측 대상에 안 잡히는 표류가 이 잡의 표적이다. 실측 자체(브라우저)는 hierarchy-measure 가,
  # 6조합 캡처 검증(pnpm design:sweep)은 로컬 절차가 맡는다(axis-approvals.md).
  design-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm design:routes
      - run: pnpm test:design-routes

  # 위계 실측(CCC-80). guard:hierarchy 가 CSS 만 보고 답할 수 없는 물음 하나를 맡는다 —
  # 세로로 이웃한 두 줄이 같은 옷인가(DESIGN.md 2-2 규칙 1). 렌더 결과를 봐야 하므로
  # 브라우저가 필요하고, 그래서 verify 와 갈라 둔다(설치가 verify 를 1분 넘게 늦춘다).
  hierarchy-measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - name: playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      # 한글 폰트(2026-08-27). CI 우분투에 CJK 폰트가 없으면 크로뮴이 대체 글리프로
      # 렌더해 글자 폭이 실제 제품과 달라지고, 기하 실측이 로컬에서 재현되지 않는
      # 가짜 overflow를 잡는다. 실측은 사용자가 보는 폰트로 해야 한다.
      - name: 한글 폰트
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: 하니스 생성과 실측
        run: pnpm design:hierarchy
      # 정렬 실측(2026-08-30 Q — align-check 스킬 계약의 레포 게이트). 같은 브라우저·폰트
      # 셋업을 재사용하므로 이 잡에 얹는다. 하니스는 자기 생성기가 따로 만든다.
      - name: 정렬 실측
        run: pnpm design:align
      - name: 실측 결과 보관
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hierarchy-measure
          path: artifacts/hierarchy-harness/measure.json
          if-no-files-found: warn

  # 파이프라인(파이썬) 테스트 — 표준 라이브러리 unittest 만 쓰므로 ML 설치가 필요 없다.
  # G3 의 마스킹 치환율 검증이 여기 걸려 있다 — CI 에 없으면 아무도 돌리지 않는 검증이 된다.
  # 시작 디렉터리가 임포트 가능해야 해서(파이썬 3.12+) tests/ 안에서 실행한다.
  pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: unittest
        working-directory: apps/pipeline/tests
        env:
          PYTHONPATH: ..
        run: |
          # pipefail 필수: 기본 셸은 파이프 앞 실패를 삼켜서 tee 의 성공만 보고 초록이 된다.
          set -o pipefail
          python3 -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # 발견 실패는 "Ran 0 tests ... OK" 로 통과한다 — 초록과 구별되지 않으므로 개수를 본다.
          count=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/unittest.log" | grep -oE '[0-9]+' || true)
          echo "discovered tests: ${count:-0}"
          test "${count:-0}" -ge 40
      - name: S13 fixture contract
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/stt/tests -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/stt-fixture.log"
          count=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/stt-fixture.log" | grep -oE '[0-9]+' || true)
          echo "discovered S13 tests: ${count:-0}"
          test "${count:-0}" -ge 24

  # gitleaks 전체 히스토리와 release:verify의 tracked-source scan은 같은 checksum 검증 바이너리를 쓴다.
  # gitleaks-action은 조직 레포에 유료 라이선스가 필요해 바이너리를 직접 받아 돌린다(MIT, 무료).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔에 필요
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run gitleaks and release verification
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${checksums}" -o "$checksums"
          sha256sum --ignore-missing -c "$checksums"
          tar -xzf "$archive" gitleaks
          # 허용목록 회귀 테스트와 release:verify가 같은 검증 바이너리를 사용한다.
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          pnpm guard:secrets:allowlist
          pnpm release:verify
          gitleaks git --no-banner --redact .
