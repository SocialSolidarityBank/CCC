name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:db

  # 파이프라인(파이썬) 테스트 — 표준 라이브러리 unittest 만 쓰므로 ML 설치가 필요 없다.
  # G3 의 마스킹 치환율 검증이 여기 걸려 있다 — CI 에 없으면 아무도 돌리지 않는 검증이 된다.
  # 시작 디렉터리가 임포트 가능해야 해서(파이썬 3.12+) tests/ 안에서 실행한다.
  pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unittest
        working-directory: apps/pipeline/tests
        env:
          PYTHONPATH: ..
        run: |
          # pipefail 필수: 기본 셸은 파이프 앞 실패를 삼켜서 tee 의 성공만 보고 초록이 된다.
          set -o pipefail
          python3 -m unittest discover -s . -p "test_*.py" -v 2>&1 | tee "$RUNNER_TEMP/unittest.log"
          # 발견 실패는 "Ran 0 tests ... OK" 로 통과한다 — 초록과 구별되지 않으므로 개수를 본다.
          count=$(grep -oE '^Ran [0-9]+ test' "$RUNNER_TEMP/unittest.log" | grep -oE '[0-9]+' || true)
          echo "discovered tests: ${count:-0}"
          test "${count:-0}" -ge 40

  # 비밀값 유출 검사 — 전체 히스토리를 매 push/PR마다 스캔한다 (.gitleaks.toml 허용 목록 적용).
  # gitleaks-action은 조직 레포에 유료 라이선스가 필요해 바이너리를 직접 받아 돌린다(MIT, 무료).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리 스캔에 필요
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # 허용목록 회귀 테스트가 PATH 에서 gitleaks 를 찾으므로 여기 올려 둔다.
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks git --no-banner --redact .
      - name: 허용목록이 파일을 통째로 가리지 않는지 확인
        run: node scripts/guard-secrets-allowlist.test.mjs
