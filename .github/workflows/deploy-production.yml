name: Deploy Production

# 운영 배포 (ccc-api · ccc). **미리보기와 모양이 일부러 다르다** — 그 차이가 이 파일의 전부다.
#
#   미리보기: main 에 머지되면 자동으로 나간다.
#   운영:     사람이 눌러야 돌고, 그 위에 승인이 한 번 더 걸린다(environment: production).
#
# 빌드·검증 단계는 deploy-preview.yml 과 **한 글자도 다르지 않다** — 파이프라인은 이미 있고,
# 여기서 새로 만드는 것은 방아쇠와 게이트뿐이다.
#
# `green` **아래 스키마 게이트는 지금 통과 상태다**(2026-08-12 확인, 2026-08-11 운영 배포도 통과).
# 이 게이트가 막는 것은 운영 D1 에 미적용 마이그레이션이 남은 채로 코드만 먼저 나가는 배포다.
# 그런 상태가 되면 게이트를 풀어서 초록으로 만들지 않고 마이그레이션을 먼저 적용한다.
# 스키마보다 앞선 코드를 배포하면 화면이 아니라 런타임에서 터진다(없는 컬럼을 조회한다).
#
# 첫 실행 전에 사람이 해야 하는 일 3가지:
#   1. GitHub 저장소 설정에서 **Environment `production` 생성 + 필수 리뷰어 지정**
#      (이게 없으면 `environment:` 는 승인 없이 그냥 통과한다 — 잠금이 아니라 라벨이 된다)
#   2. 운영 D1 마이그레이션 적용:
#      pnpm --filter @ccc/api exec wrangler d1 migrations apply ccc --env production --remote
#      docs/ops.md 의 "마이그레이션은 자동으로 안 간다" 정책은 그대로다 — 이 워크플로는
#      **적용하지 않고 확인만 한다**. 운영 PII DB 의 스키마 변경은 사람이 보고 누르는 일이다
#   3. 운영 시크릿 확인: `wrangler deploy` 는 시크릿이 없어도 **성공한다** — 워커가 런타임에
#      터질 뿐이다. 초록을 "동작한다"로 읽지 않는다. 최소 PII_ENC_KEY 가 있어야 한다
#      (pnpm --filter @ccc/api exec wrangler secret list --env production 으로 이름만 확인)
#
# `yellow` **실서비스 개시 전 선행 조건은 이 워크플로가 판단하지 않는다.**
# CLAUDE.md 8장의 보존·파기 파이프라인 미구현, D46 의 동의 게이트·법률 검토 재개 조건은
# 여전히 열려 있다. 이 파일이 있다는 것이 "배포해도 된다"는 뜻이 아니다.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '운영 배포를 확인하려면 deploy-production 을 그대로 입력한다'
        required: true
        type: string

# 미리보기와 **다른 그룹**이다 — 같은 그룹에 두면 한쪽이 다른 쪽을 취소한다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 오타 하나로 운영에 나가지 않게, 확인 문구를 먼저 본다. 승인(environment)과 별개의
  # 잠금이다 — 승인은 "누가 봤나", 이건 "무엇을 누르는지 알고 있나"를 묻는다.
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: 확인 문구 검사
        # 입력값을 `${{ }}` 로 셸 안에 직접 펼치지 않는다 — 그렇게 하면 GitHub 이 문자열을
        # **스크립트로 치환**해서 넣으므로 `"; curl ... | sh; #` 같은 입력이 그대로 실행된다.
        # env 로 넘기고 셸 변수로 읽으면 값은 값으로만 남는다. 이 워크플로를 돌릴 수 있는 사람은
        # 이미 쓰기 권한자지만, 하필 운영 배포 자리라 주입 경로를 남기지 않는다.
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy-production" ]; then
            echo "확인 문구가 다르다 (기대: deploy-production)"
            exit 1
          fi
      # 승인 게이트 실효성 확인 (CCC-117 · P1-1). environment: production 은 저장소 설정에
      # 필수 리뷰어가 있어야 잠금이다 — 없으면 통과하는 라벨이고, 그 사실을 아무도 모른 채
      # "승인 게이트가 있다"고 믿게 된다. 설정은 워크플로가 못 고치므로 로그에 경고로 남긴다.
      - name: 승인 게이트 실효성 확인 (필수 리뷰어)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/${GITHUB_REPOSITORY}/environments/production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' 2>/dev/null || echo "unknown")
          if [ "$reviewers" = "unknown" ]; then
            echo "::warning::Environment production 설정을 읽지 못했다 — 필수 리뷰어 여부를 확인할 수 없다. 저장소 Settings → Environments 에서 직접 확인한다."
          elif [ "$reviewers" = "0" ]; then
            echo "::warning::Environment production 에 필수 리뷰어가 없다 — environment: 줄은 승인 게이트가 아니라 통과하는 라벨이다. Settings → Environments → production 에서 Required reviewers 를 지정한다."
          else
            echo "Environment production 필수 리뷰어 규칙 확인 — 승인 게이트가 실제로 잠긴다."
          fi

  verify:
    needs: confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:db
      - run: pnpm guard:tokens
      - run: pnpm guard:align

  # 스키마 게이트 — docs/ops.md 의 "마이그레이션은 자동으로 안 간다"를 주석이 아니라 **잡**으로 만든다.
  # 미적용 마이그레이션이 남아 있으면 배포를 막는다.
  schema-gate:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 운영 D1 미적용 마이그레이션 확인
        # **종료 코드에 기대지 않고 출력을 읽는다.** `migrations list` 는 보고 명령이라
        # 미적용이 남아 있어도 0 으로 끝날 수 있다 — 그러면 게이트가 초록으로 통과하면서
        # 아무것도 막지 않는다. 막지 않는 게이트는 게이트가 없는 것보다 나쁘다(있다고 믿게 된다).
        # 그래서 "적용할 마이그레이션 없음" 문구를 **명시적으로 확인**하고, 아니면 실패시킨다.
        run: |
          set -o pipefail
          pnpm --filter @ccc/api exec wrangler d1 migrations list ccc --env production --remote \
            2>&1 | tee "$RUNNER_TEMP/migrations.txt" || true
          if grep -qiE 'No migrations to apply|적용할 마이그레이션' "$RUNNER_TEMP/migrations.txt"; then
            echo "운영 D1 스키마가 레포와 같다 — 배포 진행 가능."
            exit 0
          fi
          echo "::error::운영 D1 에 미적용 마이그레이션이 있다. 코드를 스키마보다 앞세우지 않는다."
          echo "적용: pnpm --filter @ccc/api exec wrangler d1 migrations apply ccc --env production --remote"
          echo "--- migrations list 출력 ---"
          cat "$RUNNER_TEMP/migrations.txt"
          exit 1

  deploy-production:
    needs: schema-gate
    runs-on: ubuntu-latest
    # 승인 게이트. **저장소 설정에서 Environment 를 만들고 리뷰어를 지정해야 실제로 잠긴다** —
    # 없으면 이 줄은 통과하는 라벨일 뿐이다(위 머리말 1번).
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # API 를 먼저 배포한다 — 웹이 서비스 바인딩(CCC_API → ccc-api)으로 API 를 부르므로
      # 순서가 뒤집히면 새 웹이 옛 API 를 잠깐 친다(미리보기와 같은 순서다).
      - name: API 운영 배포 (ccc-api)
        run: pnpm --filter @ccc/api exec wrangler deploy --env production
      # 웹은 **--env 를 붙이지 않는다.** wrangler.jsonc 의 최상위 name 이 곧 운영("ccc")이고
      # named env 는 preview 하나뿐이다 — 여기서 --env production 을 쓰면 없는 환경을 찾는다.
      # 미리보기 워크플로를 그대로 베끼면 틀리는 유일한 자리다.
      - name: WEB 운영 빌드·배포 (ccc)
        run: |
          pnpm --filter @ccc/web exec opennextjs-cloudflare build
          pnpm --filter @ccc/web exec opennextjs-cloudflare deploy
      # 크론이 다시 등록된다(*/30 워치독 · 03:00 PII 파기, D8·D10). 2026-08-12 확인 기준
      # 파기 후보는 0건이다. purge_due 를 채우는 것은 0006 의 DB 트리거 하나뿐이고
      # (0031 까지 훑어 재확인), 그 트리거는 케이스 **종결 시에만** 걸리는데 운영에는
      # 종결 케이스가 없다.
      # 배포 후 스모크 (CCC-117 · P1-1) — deploy-production.mjs 4단계와 같은 3종이다.
      # 초록 배포 ≠ 동작하는 서비스. 하나라도 실패하면 잡이 빨간불로 끝난다 —
      # "배포 완료" 안내만 찍고 초록으로 끝나던 예전 단계를 게이트로 올렸다.
      - name: 배포 후 스모크 (웹 생존 · API fail-closed · 크론)
        run: |
          set -u
          failed=0

          # ① 웹이 살아 있는가 — GET / 이 200 또는 리다이렉트(3xx).
          web_status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://ccc.account-855.workers.dev/ || echo 000)
          case "$web_status" in
            200|3??) echo "스모크 ① 웹 GET / → $web_status (살아 있음)" ;;
            *) echo "::error::스모크 ① 실패 — 웹 GET / 이 $web_status (200/3xx 가 아니다)"; failed=1 ;;
          esac

          # ② API 가 무인증을 거부하는가 — 401/403(또는 Access 가로채기 3xx)이어야 통과.
          # 200 이면 인증 게이트가 꺼진 채 PII 경로가 열려 있다는 뜻이다(fail-closed 증명).
          api_headers=$(curl -s -o /dev/null -D - --max-time 30 https://ccc-api.account-855.workers.dev/ || true)
          api_status=$(printf '%s' "$api_headers" | head -1 | grep -oE '[0-9]{3}' | head -1 || echo 000)
          api_location=$(printf '%s' "$api_headers" | grep -i '^location:' | head -1 || true)
          if [ "$api_status" = "401" ] || [ "$api_status" = "403" ]; then
            echo "스모크 ② API 무인증 → $api_status (fail-closed 확인)"
          elif printf '%s' "$api_location" | grep -qi 'cloudflareaccess\.com'; then
            echo "스모크 ② API 무인증 → $api_status (Access 가로채기 — fail-closed 확인)"
          else
            echo "::error::스모크 ② 실패 — API 무인증 요청이 $api_status (401/403 이 아니다. 200 이면 인증 게이트가 열려 있다)"
            failed=1
          fi

          # ③ 크론이 다시 등록됐는가 — 배포 기록 출력에서 문자열로 확인한다.
          crons=$(pnpm --filter @ccc/api exec wrangler deployments list --env production 2>&1 || true)
          if printf '%s' "$crons" | grep -qF '*/30 * * * *' && printf '%s' "$crons" | grep -qF '0 3 * * *'; then
            echo "스모크 ③ 크론 재등록 확인: */30(워치독 D8) · 0 3 * * *(PII 파기 D10)"
          else
            echo "::error::스모크 ③ 실패 — 배포 기록에서 크론(*/30 · 0 3 * * *)을 확인하지 못했다. 대시보드 Triggers 탭에서 직접 본다."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "복구 절차 (docs/ops.md 운영 배포 절, 둘 중 하나):"
            echo "  A. 직전 배포로 롤백:"
            echo "     pnpm --filter @ccc/api exec wrangler rollback --env production"
            echo "     pnpm --filter @ccc/web exec wrangler rollback"
            echo "  B. 이전 태그 재배포 (태그 목록은 docs/releases.md):"
            echo "     gh workflow run deploy-production.yml --ref <이전태그> -f confirm=deploy-production"
            exit 1
          fi
