name: Deploy Preview Branch (Temporary)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '브랜치 프리뷰 배포를 확인하려면 deploy-preview-branch 를 입력한다'
        required: true
        type: string

concurrency:
  group: deploy-preview-ccc237-address
  cancel-in-progress: false

jobs:
  deploy-preview-branch:
    if: github.ref == 'refs/heads/preview/ccc237-address' && inputs.confirm == 'deploy-preview-branch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: a888c64c6441645de03136ffc4e056eafeb3caf1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm guard:db
      - run: pnpm guard:tokens
      - run: pnpm guard:align
      - name: 프리뷰 D1 마이그레이션
        run: pnpm --filter @ccc/api exec wrangler d1 migrations apply ccc-preview --env preview --remote
      - name: API 프리뷰 배포
        run: pnpm --filter @ccc/api exec wrangler deploy --env preview
      - name: 빌드 도장 설정
        run: echo "NEXT_PUBLIC_CCC_BUILD_STAMP=preview/ccc237-address @ ${SOURCE_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_ENV"
      - name: WEB 프리뷰 빌드·배포
        run: |
          pnpm --filter @ccc/web exec opennextjs-cloudflare build
          pnpm --filter @ccc/web exec opennextjs-cloudflare deploy --env preview
      - name: 배포 도장 확인
        run: |
          for attempt in {1..12}; do
            html=$(curl -fsSL --max-time 30 -H 'cache-control: no-cache' https://ccc-preview.account-855.workers.dev/preview || true)
            if printf '%s' "$html" | grep -Fq "${SOURCE_SHA::7}"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
