<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>설정 시연 | CCC</title>
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/wire.css">
  <link rel="stylesheet" href="/prototype.css">
</head>
<body>
  <a class="skip-link wire-button" data-variant="neutral" href="#main">본문으로 이동</a>
  <div id="scrim" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="설정 메뉴">
    <div class="brand"><button id="close-menu" class="wire-button mobile-only" data-variant="neutral" aria-label="메뉴 닫기">닫기</button><span data-institution>햇살연대</span><div id="drawer-actions"></div></div>
    <div class="sidebar-return"><a class="wire-button" data-variant="neutral" href="?module=work&amp;role=all" data-route="work">업무 화면으로 돌아가기</a></div>
    <nav id="navigation" aria-label="설정"></nav>
    <div class="sidebar-foot"><span class="meta">가상 기관 / 연결 전 시안</span></div>
  </aside>
  <header class="app-header"><span id="header-title">설정</span><div id="header-actions"><button id="theme" class="header-icon-button" aria-label="다크 모드" title="다크 모드"></button><button id="open-menu" class="wire-button mobile-only" data-variant="neutral" aria-controls="sidebar" aria-expanded="false" aria-label="설정 메뉴 열기">메뉴</button></div></header>
  <main id="main" tabindex="-1">
    <div class="page-container">
      <section class="preview-controls" aria-label="프리뷰 전용 조건">
        <label class="wire-form-field"><span class="wire-form-label">역할 시연</span><span class="wire-input-box"><select id="role"><option value="all">전체 둘러보기 (프리뷰 전용)</option><option value="admin">기관 관리자</option><option value="tech">기관 기술 관리자</option><option value="both">기관 관리자 + 기관 기술 관리자</option><option value="lead">실무 책임자</option><option value="counselor">실무자</option></select></span></label>
        <label class="wire-form-field"><span class="wire-form-label">화면 상태 시연</span><span class="wire-input-box"><select id="scenario"></select></span></label>
        <button id="reset" class="wire-button" data-variant="neutral">시연 초기화</button>
      </section>
      <p class="meta preview-notice">모든 자료와 결과는 가상 예시입니다. 변경은 이 페이지 메모리에만 남고 새로고침하면 사라집니다. 서버 저장, 방문자 격리, 7일 유지, 외부 호출과 파일 생성은 연결되지 않았습니다. 실제 개인정보나 키는 입력하지 마세요.</p>
      <div class="page-heading"><h1 id="page-title" class="wire-page-title" tabindex="-1">기관 정보</h1><p id="page-description" class="meta"></p></div>
      <div id="content"></div>
      <p id="announcement" class="meta feedback" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>
  </main>
  <noscript>이 독립 시안의 메뉴와 시연 폼은 JavaScript가 필요합니다. 실제 업무 서비스가 아닙니다.</noscript>
  <script type="module" src="/prototype.js"></script>
</body>
</html>
