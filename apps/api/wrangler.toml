name = "ccc-api-local"
main = "src/index.ts"
compatibility_date = "2026-07-06"

[vars]
LOCAL_ACTOR_HEADER_MODE = "true"
# D8 무폴링 판정 임계값(시간). 미설정이면 gateway 기본값 6시간.
PIPELINE_STALE_HOURS = "6"
# 공개 가입 표면 스위치(CCC-112). 정확히 "1"일 때만 공개 초대 조회·가입(과 초대 발급)이
# 열린다. 로컬 개발에서는 켜서 /join 흐름을 그대로 돌린다.
PUBLIC_SIGNUP_ENABLED = "1"

# 예약 작업(D8·D32·D46). src/index.ts scheduled 핸들러가 controller.cron으로 분기한다:
#   - "0 3 * * *"  (매일 03:00 UTC): 도래 PII 아카이브·보존 재검토(자동 파기 없음)
#   - 그 외(30분마다): 폴링 워치독 — stale 조직 관리자 알림(D8)
# 로컬(miniflare)에서는 트리거가 자동 실행되지 않는다. 테스트는 createScheduledJobRunner(env).run(kind, nowIso)
# 을 직접 호출한다. 실제 스케줄은 Cloudflare 계정 개설 후 배포로 활성화된다(D16).
[triggers]
crons = ["*/30 * * * *", "0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ccc-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../../migrations"

# 상담 녹음 원본 임시 보관 (R2). 키에는 PII를 넣지 않는다 (audio/<sessionId>/<uuid>).
# 음성 원본 30일 뒤 자동 삭제(스펙 2·5장)는 버킷 lifecycle 규칙 'audio-30d-expiry'로
# 적용 완료(2026-07-10, wrangler r2 bucket lifecycle add). 코드가 아닌 계정 설정이므로
# 버킷 재생성 시 규칙도 다시 걸어야 한다.
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "ccc-audio"

# ── 운영 환경 (Cloudflare 조직 계정, 2026-07-10 개설) ──────────────────────
# 배포: pnpm exec wrangler deploy --env production (apps/api에서)
# named env는 vars·d1·r2·crons를 상속하지 않으므로 전부 명시한다.
# LOCAL_ACTOR_HEADER_MODE를 설정하지 않는다 → identity.ts가 fail-closed(401).
# Access JWT 검증 구현 전까지 운영 API는 의도적으로 잠긴 상태다(D16).
[env.production]
name = "ccc-api"
# 운영 URL: ccc-api.account-855.workers.dev — Cloudflare Access로 보호한다
# (계정에 도메인 zone이 없어 커스텀 도메인 대신 workers.dev 사용, 2026-07-10).
# Access 미설정/변수 미설정 상태에서도 identity.ts가 fail-closed(401)로 잠근다.
workers_dev = true

[env.production.vars]
PIPELINE_STALE_HOURS = "6"
# PII 키 세대(D3): 2026-07-18 로테이션(v2). 이후 저장되는 vault 행은 key_version=2 로 찍힌다.
# 로테이션 시점에 운영 금고의 암호문이 0건이라 재암호화 없이 키만 교체했다.
PII_KEY_VERSION = "2"
# Cloudflare Access 앱 "CCC API"와 "CCC" 웹 앱의 AUD를 모두 검증한다.
# 값은 비밀이 아니며, API 직접 호출과 웹 Worker service binding 양쪽 신원을 허용한다.
ACCESS_TEAM_DOMAIN = "socialsolidaritybank.cloudflareaccess.com"
ACCESS_AUD = "3dbacf213494f7624c00676ce62742c414528997fd2a23c21e926c16d79404d2,52d5b26bf947ea0e6964336ed57dde622f8e8b6ac7f5f452edf1ebd0ac89c2b7"
# PUBLIC_SIGNUP_ENABLED 는 의도적으로 **두지 않는다**(CCC-112) — 없음이 곧 닫힘이라
# 운영 공개 가입 표면(초대 조회·가입·발급)은 404 다. 공개 오픈을 승인받은 배포에만 "1"을 둔다.

[env.production.triggers]
crons = ["*/30 * * * *", "0 3 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "ccc"
database_id = "554dd4ef-c45b-4649-bc88-a7f103f3fc5c"
migrations_dir = "../../migrations"

[[env.production.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "ccc-audio"

# ── 미리보기 환경 (CCC-6, 팀원 피드백 채널) ──────────────────────────────
# 운영과 완전 분리: 전용 워커 ccc-api-preview + 전용 D1(가상 시드 데이터만).
# Access 를 거치지 않고 코드 게이트(preview-gate.ts)로 신원을 공급한다.
# 배포: pnpm exec wrangler deploy --env preview (apps/api에서).
# named env 는 vars·d1·crons 를 상속하지 않으므로 전부 명시한다.
# ACCESS_* 를 두지 않으므로(비어 있음) PREVIEW_MODE 로 코드 게이트가 활성화된다.
# 시크릿(값 커밋 금지, 이름만): PREVIEW_ACCESS_CODE, PII_ENC_KEY
#   → pnpm exec wrangler secret put <이름> --env preview
[env.preview]
name = "ccc-api-preview"
workers_dev = true

[env.preview.vars]
PIPELINE_STALE_HOURS = "6"
# 시드 PII 는 key_version=2 로 스탬프되고 단일 PII_ENC_KEY 로 복호화된다(dev·prod 와 동일). 2 로 맞춘다.
PII_KEY_VERSION = "2"
# 코드 게이트 스위치. Access env 를 두지 않아 이중 잠금의 ②가 비어 코드 게이트가 열린다.
PREVIEW_MODE = "true"
# 미리보기 세션이 신원으로 쓸 고정 데모 상담사(가상 시드 users 디렉터리의 활성 상담사).
# ai00 은 시드에서 담당 참여자가 많아 브리핑·일정 화면이 실제 데이터로 채워진다.
PREVIEW_ACTOR_EMAIL = "ai00@ggbss.or.kr"
# 관리자 시점 테스터(2026-07-30 Q 요청). 위 실무자 코드와 **다른 코드**로 들어오면 이 신원이 된다
# — 팀원은 실무자 화면을 그대로 보고, 관리자 화면은 코드를 아는 사람만 본다.
# 짝인 시크릿 PREVIEW_ADMIN_ACCESS_CODE 를 넣지 않으면 이 경로 자체가 없다(둘 다 있어야 열린다).
#   pnpm exec wrangler secret put PREVIEW_ADMIN_ACCESS_CODE --env preview
PREVIEW_ADMIN_ACTOR_EMAIL = "account@bss.or.kr"
# 종단 점검(E2E) 기본 신원 — 처리 장비 역할. 미리보기는 Access 서비스 토큰이 없어
# service 역할이 될 수 없고, 그래서 "수기 저장 → 장비 마스킹 → 불일치 검출" 종단
# 경로를 실물로 확인할 수 없었다(D57·ADR-0027). 짝인 시크릿 PREVIEW_E2E_ACCESS_CODE
# 를 넣지 않으면 이 경로 자체가 없다(둘 다 있어야 열린다 — 관리자 시점과 같은 규칙).
#   pnpm exec wrangler secret put PREVIEW_E2E_ACCESS_CODE --env preview
PREVIEW_SERVICE_ACTOR_EMAIL = "service-token-client-id.access"
# AI 사업자 설정 (D57 · ADR-0027). 시크릿이 아니라 "어느 모델을 승인해 쓰는가"의 기록이라
# 값을 커밋한다 — 짝인 CODEX_API_KEY 는 시크릿이라 여기 없다(둘 다 있어야 호출이 열린다).
# 앞 네 값은 코드가 요구하는 고정값이고, model 만 고른다(2026-07-31 Q 선택: gpt-5.6-luna).
# 교체 후보: gpt-5.4-mini · gpt-5-mini — 이 줄만 바꾸면 된다.
AI_PROVIDER_CONFIG = '{"registryVersion":"phase1.v1","providerId":"codex","adapterVersion":"v1","configVersion":"v1","model":"gpt-5.6-luna"}'
# 유료 외부 AI 실호출은 별도 승인 전까지 기본 OFF. AI_PROVIDER_CONFIG와 CODEX_API_KEY가
# 이미 있어도 이 값이 정확히 "1"이 아니면 네트워크 호출을 시작하지 않는다.
EXTERNAL_AI_CALLS_ENABLED = "0"
# 텍스트 AI 파일럿 스위치. 꺼져 있으면 AI 초안·불일치 검출이 사용되지 않고,
# 텍스트 일감 큐도 비어 보인다(ADR-0027). 미리보기는 가상 시드 전용이라 켠다.
TEXT_AI_PILOT_ENABLED = "1"
# 공개 가입 표면 스위치(CCC-112). 미리보기는 팀원이 코드 게이트 뒤에서 가입 흐름을
# 검수하는 채널이므로 켠다 — 코드 세션 요구(preview-gate)는 이 값과 무관하게 유지된다.
PUBLIC_SIGNUP_ENABLED = "1"

# 크론 트리거는 미리보기에서 비활성. 주의: triggers 를 생략하면 top-level crons 가
# 상속되므로(첫 배포에서 실측), 빈 배열로 명시해 상속을 끊는다.
[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "ccc-preview"
database_id = "0dc35280-1051-4916-9598-0e92f6e01844"
migrations_dir = "../../migrations"

# 클로즈 베타 녹음 검증용 전용 버킷. 운영 ccc-audio 와 분리하고, 계정 설정에서
# lifecycle 규칙 audio-30d-expiry(30일 뒤 자동 삭제)를 별도로 적용한다.
[[env.preview.r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "ccc-audio-preview"
